<?xml version="1.0" encoding="UTF-8"?>
<!-- InnoVault.Vectors gallery sample: rect(rx) / circle / ellipse / line / polyline / polygon / path (C S a Z),
     linear + radial gradients (objectBoundingBox + gradientTransform), dashes, round join/cap, evenodd hole,
     group transforms (translate rotate skewX), group opacity and inline style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a49"/>
      <stop offset="1" stop-color="#4a6fa5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4c2"/>
      <stop offset="60%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%" gradientTransform="rotate(20 0.5 0.5)">
      <stop offset="0" stop-color="#b8f3ff"/>
      <stop offset="1" stop-color="#3a86ff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="192" height="112" rx="10" ry="10" fill="url(#sky)" stroke="#9cc3ff" stroke-width="2"/>
  <circle cx="150" cy="40" r="26" fill="url(#sun)"/>
  <g transform="translate(40 60) rotate(-15)" stroke="#e0f0ff" stroke-width="2" fill="none">
    <ellipse cx="0" cy="0" rx="26" ry="12"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke-dasharray="4 3"/>
    <polyline points="-20,-20 -10,-8 0,-18 10,-6 20,-16" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <path d="M 20 100 C 50 70, 90 130, 120 100 S 170 80, 190 104" fill="none" stroke="url(#blade)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="100,20 106,34 121,34 109,43 113,58 100,49 87,58 91,43 79,34 94,34" fill="#ffd166" fill-opacity="0.9" stroke="#8a5a00" stroke-width="1"/>
  <path d="M 50 24 a 10 10 0 1 0 20 0 a 10 10 0 1 0 -20 0 Z M 55 24 a 5 5 0 1 0 10 0 a 5 5 0 1 0 -10 0 Z" fill="#7bd389" fill-rule="evenodd"/>
  <g opacity="0.6" style="fill:#ff6b6b;stroke:#ffffff;stroke-width:1">
    <rect x="14" y="12" width="14" height="14" transform="skewX(-15)"/>
  </g>
</svg>
